# Colors section of "Alacritty - TOML configuration file format"
# https://github.com/alacritty/alacritty/blob/master/extra/man/alacritty.5.scd#colors
#

[general]
# import = [
#     "~/dotfiles/alacritty/.config/alacritty/themes/themes/tokyo_night_storm.toml"
# ]

[colors.primary]
background = "0x191D23"
foreground = "0xC2CBDA"
bright_foreground = "0xDFE4ED"

[colors.normal]
black = "0x22272E"
red = "0xE7474C"
green = "0x86D1AE"
yellow = "0xF5B856"
blue = "0x849EE3"
magenta = "0xC8C5ED"
cyan = "0x4A9AA9"
white = "0xD7DDE9"

[colors.bright]
black = "0x5A5E76"
red = "0xEA6A73"
green = "0x57C673"
yellow = "0xE7C58D"
blue = "0xBAC6EF"
magenta = "0xD3D0F0"
cyan = "0xB8DFD6"
white = "0xDFE4ED"

[colors.cursor]
text = "0x22272E"
cursor = "0x86D1AE"

[colors.selection]
text = "0xD7DDE9"
background = "0x1B2951"

[colors.search.matches]
foreground = "0x191D23"
background = "0xFFFB52"

[colors.search.focused_match]
foreground = "0x191D23"
background = "0xFFFB52"

[cursor]
style = "Block"

[font]
size = 11



[font.normal]
family = "CommitMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "CommitMono Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "CommitMono Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "CommitMono Nerd Font Mono"
style = "Italic"


[font.offset]
x = 2
y = 8

[font.glyph_offset]
x = 0
y = 4

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[window]
dynamic_title = true
opacity = 1
startup_mode = "Maximized"
option_as_alt = "Both"
decorations = "None"
padding = { x = 8, y = 8 }
                        
